[project]
name = "2048-destroyer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.4"]
[project.optional-dependencies]
ui = ["matplotlib>=3.8"]
dev = ["pytest>=8"]
[project.scripts]
destroyer = "destroyer.app:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

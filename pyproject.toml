[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "2048-destroyer"
version = "0.1.0"
description = "Research agents and search for the 2048 puzzle, including N-tuple learning, DQN, and Expectimax."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Reiwa-111"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.4"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
destroyer = "destroyer.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
